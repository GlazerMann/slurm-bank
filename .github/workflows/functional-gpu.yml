name: Functional tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  functional-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Perl runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libswitch-perl

      - name: Run mock-backed functional suite
        run: make -C t functional-gpu
